<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPS — Access Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #FF5E1A;
      --orange-dim: #CC4A14;
      --orange-glow: rgba(255, 94, 26, 0.4);
      --amber: #FFA500;
      --amber-glow: rgba(255, 165, 0, 0.35);
      --bg0: #060810;
      --bg1: #0D1117;
      --bg2: #111827;
      --bg3: #1a2235;
      --border: rgba(255, 94, 26, 0.2);
      --border-bright: rgba(255, 94, 26, 0.5);
      --amber-border: rgba(255, 165, 0, 0.35);
      --text: #E8EDF5;
      --text-dim: #8899AA;
      --text-muted: #445566;
      --font-head: 'Orbitron', monospace;
      --font-body: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg0);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── GRID BACKGROUND ── */
    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,94,26,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,94,26,0.04) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .grid-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(255,94,26,0.05) 0%, transparent 70%),
        radial-gradient(ellipse 100% 80% at 50% 100%, rgba(6,8,16,0.8) 0%, transparent 60%);
    }

    /* Animated scan lines */
    .scan-h {
      position: fixed;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,94,26,0.3), transparent);
      animation: scanH 8s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes scanH {
      0% { top: -2px; opacity: 0; }
      3% { opacity: 1; }
      97% { opacity: 1; }
      100% { top: 100vh; opacity: 0; }
    }

    /* ── CORNER DECOR ── */
    .corner {
      position: fixed;
      width: 60px; height: 60px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
    }
    .corner.tl { top: 24px; left: 24px; border-top: 1px solid var(--orange); border-left: 1px solid var(--orange); }
    .corner.tr { top: 24px; right: 24px; border-top: 1px solid var(--orange); border-right: 1px solid var(--orange); }
    .corner.bl { bottom: 24px; left: 24px; border-bottom: 1px solid var(--orange); border-left: 1px solid var(--orange); }
    .corner.br { bottom: 24px; right: 24px; border-bottom: 1px solid var(--orange); border-right: 1px solid var(--orange); }

    /* ── COORDINATE LABELS ── */
    .coords {
      position: fixed;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 1;
    }
    .coords.tl { top: 28px; left: 92px; }
    .coords.br { bottom: 28px; right: 92px; }

    /* ── CARD ── */
    .card-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 0 16px;
    }

    .card {
      background: var(--bg1);
      border: 1px solid var(--amber-border);
      padding: 48px 40px 36px;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(255,165,0,0.06),
        0 0 40px rgba(255,94,26,0.08),
        0 0 80px rgba(255,94,26,0.04),
        inset 0 1px 0 rgba(255,165,0,0.1);
    }

    /* Amber corner accents */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
    }
    .card::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--amber);
      border-left: 2px solid var(--amber);
    }
    .card::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--amber);
      border-right: 2px solid var(--amber);
    }

    /* Inner corners */
    .card-corner-tr, .card-corner-bl {
      position: absolute;
      width: 20px; height: 20px;
    }
    .card-corner-tr {
      top: -1px; right: -1px;
      border-top: 2px solid var(--amber);
      border-right: 2px solid var(--amber);
    }
    .card-corner-bl {
      bottom: -1px; left: -1px;
      border-bottom: 2px solid var(--amber);
      border-left: 2px solid var(--amber);
    }

    /* ── LOGO ── */
    .logo-wrap {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo {
      font-family: var(--font-head);
      font-size: 40px;
      font-weight: 900;
      color: var(--orange);
      letter-spacing: 4px;
      text-shadow:
        0 0 20px var(--orange-glow),
        0 0 40px rgba(255,94,26,0.3),
        0 0 80px rgba(255,94,26,0.15);
      display: block;
      margin-bottom: 6px;
    }
    .logo-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--amber);
      opacity: 0.8;
    }

    /* ── ACCESS LABEL ── */
    .access-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--amber);
      text-align: center;
      margin-bottom: 32px;
      padding: 8px;
      border: 1px solid rgba(255,165,0,0.15);
      background: rgba(255,165,0,0.04);
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    .form-input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 12px 16px;
      outline: none;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input:focus {
      border-color: var(--orange);
      background: rgba(255,94,26,0.04);
      box-shadow: 0 0 0 1px rgba(255,94,26,0.2), inset 0 0 20px rgba(255,94,26,0.02);
    }
    .form-input.password-field { padding-right: 44px; }

    /* Show/hide toggle */
    .toggle-vis {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: color 0.2s;
      line-height: 1;
    }
    .toggle-vis:hover { color: var(--orange); }

    /* ── SUBMIT BUTTON ── */
    .btn-submit {
      width: 100%;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--bg0);
      background: var(--orange);
      border: none;
      padding: 15px;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 24px;
      transition: all 0.2s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
    }
    .btn-submit:hover:not(:disabled) {
      background: #FF7A3D;
      box-shadow: 0 0 25px var(--orange-glow);
    }
    .btn-submit:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    /* Spinner */
    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(6,8,16,0.3);
      border-top-color: var(--bg0);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner { display: block; }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }
    .divider span {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── LINKS ── */
    .card-links {
      text-align: center;
      margin-bottom: 16px;
    }
    .card-links a {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
      letter-spacing: 0.5px;
    }
    .card-links a:hover { color: var(--orange); }
    .card-links a.accent { color: var(--orange); }
    .card-links a.accent:hover { text-shadow: 0 0 10px var(--orange-glow); }

    /* ── SECURITY NOTE ── */
    .security-note {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.04);
      line-height: 1.8;
    }
    .security-note .security-icons {
      font-size: 13px;
      margin-bottom: 4px;
    }

    /* ── VERSION ── */
    .version {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 2px;
      z-index: 10;
    }
  </style>
</head>

        <label class="form-label" for="email">// Operator Email</label>
        <input
          class="form-input"
          type="email"
          id="email"
          placeholder="founder@company.io"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">// Access Code</label>
        <div class="input-wrap">
          <input
            class="form-input password-field"
            type="password"
            id="password"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          >
          <button type="button" class="toggle-vis" id="toggleVis" onclick="togglePassword()" title="Toggle visibility">
            👁
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">Enter Command Center</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="divider"><span>or</span></div>

    <div class="card-links" style="margin-bottom: 10px;">
      <a href="index.html">First time? <span class="accent">Deploy your A.I.R. →</span></a>
    </div>
    <div class="card-links">
      <a href="#">Forgot credentials?</a>
    </div>

    <div class="security-note">
      <div class="security-icons">🔒 🛡 🖥</div>
      256-bit encrypted · Isolated VPS · Your data stays yours
    </div>
  </div>
</div>

<div class="version">SPS Platform v1.0.0</div>

<script>
  function togglePassword() {
    const pw = document.getElementById('password');
    const btn = document.getElementById('toggleVis');
    if (pw.type === 'password') {
      pw.type = 'text';
      btn.textContent = '🙈';
    } else {
      pw.type = 'password';
      btn.textContent = '👁';
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.classList.add('loading');
    btn.disabled = true;
    setTimeout(function() {
      window.location.href = 'sps-hub.html';
    }, 1500);
  }
</script>

</body>
</html>
